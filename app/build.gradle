apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

import java.util.Properties

android {
    compileSdkVersion 33

    defaultConfig {
        applicationId "com.rioai.app"
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 1
        versionName "0.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Load GEMINI_API_KEY from local.properties (if present) or environment variable
        def localProps = new Properties()
        def localFile = rootProject.file('local.properties')
        if (localFile.exists()) {
            localProps.load(new FileInputStream(localFile))
        }
        def geminiKey = localProps.getProperty('GEMINI_API_KEY') ?: System.getenv('GEMINI_API_KEY') ?: ""
        buildConfigField "String", "GEMINI_API_KEY", '"' + geminiKey + '"'

        // Optional GEMINI base url override
        def geminiBaseUrl = localProps.getProperty('GEMINI_BASE_URL') ?: System.getenv('GEMINI_BASE_URL') ?: "https://generativelanguage.googleapis.com"
        buildConfigField "String", "GEMINI_BASE_URL", '"' + geminiBaseUrl + '"'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.7.20"
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Lifecycle + coroutines
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'

    // WorkManager for background tasks
    implementation 'androidx.work:work-runtime-ktx:2.8.1'

    // Logging
    implementation 'com.jakewharton.timber:timber:5.0.1'

    // Networking (OkHttp + Retrofit if needed)
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.11.0'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    // JSON
    implementation 'com.google.code.gson:gson:2.10.1'

    // Tests
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
